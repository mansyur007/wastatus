name: CI

# Gate tipe + build. Repo ini publik, jadi PR dari fork jalan TANPA secrets —
# aman karena job ini tidak menyentuh VPS sama sekali.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
