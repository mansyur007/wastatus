name: Deploy wa-status to VPS

# Auto-deploy ke https://wastatus.emha.space tiap push ke main.
#
# dist/ dibangun DI RUNNER, bukan di VPS: box cuma punya ~500Mi RAM bebas dan
# `tsc -b && vite build` di sana berisiko OOM-kill container estate lain.
# Yang dikirim hanya hasil build + file container; imagenya sekadar
# caddy:2-alpine + COPY dist.
#
# App ini stateless (semua konversi terjadi di browser pengunjung), jadi
# rsync --delete aman: tidak ada volume, tidak ada .env, tidak ada data.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-wa-status
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build dist/
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync build + container files to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/wa-status/dist/"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy" \
            Dockerfile Caddyfile.container docker-compose.prod.yml .dockerignore \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/wa-status/"

      - name: Build & up on VPS
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -se <<'REMOTE'
          set -e
          cd /opt/wa-status
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f
          REMOTE

      - name: Smoke test (wastatus.emha.space lewat emha-caddy)
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sleep 5; curl -fsS --retry 5 --retry-delay 3 --retry-connrefused \
               --resolve wastatus.emha.space:443:127.0.0.1 https://wastatus.emha.space/ -o /dev/null \
             && echo 'Smoke OK: wa-status live'"
